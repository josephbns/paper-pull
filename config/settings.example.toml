# OLDER FORMAT, kept for existing installs and automated tests.
# New setups use profiles/<name>.toml instead (see docs/SETUP.md).
# One collaboration profile: copy to config/settings.toml (git-ignored).
# Put private API keys and contact email in .env / process variables, never here.
# Legacy separate query/watchlist files still work, but are not used by this profile.

start_date = "2021-01-01"
arxiv_window_days = 90

[collaboration]
name = "IBM–Cleveland Clinic"
partner_name = "Cleveland Clinic"
partner_label = "CCF"
ibm_name = "IBM"

[storage]
# Current CCF workspace. For another QIC, use a separate path such as workspaces/my-qic.
workspace = "."

[openalex]
# Supplied parent IDs; validate live and decide on extra entities before production use.
ibm_institution_ids = ["I1341412227"]
partner_institution_ids = ["I1316902750"]
# TODO(owner): review IBM Japan / other IBM entities and Clinic Abu Dhabi, Akron, London.
quantum_terms = ["quantum"]
skip_types = ["dataset", "software", "paratext", "peer-review", "grant",
              "supplementary-materials", "editorial", "report", "other"]

[arxiv]
# Existing CCF query preserved verbatim. Replace this whole query for another QIC.
query = '''
( au:"Kenneth Merz" OR au:"Kenneth M Merz" OR au:"Feixiong Cheng" OR au:"Vijay Krishna" OR au:"Daniel Blankenberg" OR au:"Bryan Raubenolt" OR au:"Fabio Cumbo" OR au:"Jayadev Joshi" OR au:"Frank DiFilippo" OR au:"Jun Qin" OR au:"Akhil Shajan" OR au:"Danil Kaliakin" OR au:"Fangchun Liang" OR au:"Subhamoy Bhowmik" OR au:"Susanta Das" OR au:"Sergii Strelchuk" OR all:"Cleveland Clinic" OR all:ibm_cleveland ) AND ( cat:quant-ph OR all:"quantum computing" OR all:"quantum computer" OR all:"quantum computers" OR all:"quantum hardware" OR all:"quantum processor" OR all:"quantum processors" OR all:"quantum circuit" OR all:"quantum circuits" OR all:"quantum algorithm" OR all:"quantum algorithms" OR all:"quantum machine learning" OR all:"quantum-centric" OR all:Qiskit OR all:qubit OR all:qubits )
'''

# Public names from the original feed. Add only confirmed public IBM/partner authors.
# side is IBM or PARTNER; arxiv_name may differ from the display name.
# TODO(owner): add IBM-side names and review collision-prone names below.
common_names = []
watchlist = [
    { name = "Kenneth Merz", side = "PARTNER", arxiv_name = "Kenneth Merz" },
    { name = "Kenneth Merz", side = "PARTNER", arxiv_name = "Kenneth M Merz" },
    { name = "Feixiong Cheng", side = "PARTNER", arxiv_name = "Feixiong Cheng" },
    { name = "Vijay Krishna", side = "PARTNER", arxiv_name = "Vijay Krishna" },
    { name = "Daniel Blankenberg", side = "PARTNER", arxiv_name = "Daniel Blankenberg" },
    { name = "Bryan Raubenolt", side = "PARTNER", arxiv_name = "Bryan Raubenolt" },
    { name = "Fabio Cumbo", side = "PARTNER", arxiv_name = "Fabio Cumbo" },
    { name = "Jayadev Joshi", side = "PARTNER", arxiv_name = "Jayadev Joshi" },
    { name = "Frank DiFilippo", side = "PARTNER", arxiv_name = "Frank DiFilippo" },
    { name = "Jun Qin", side = "PARTNER", arxiv_name = "Jun Qin" },
    { name = "Akhil Shajan", side = "PARTNER", arxiv_name = "Akhil Shajan" },
    { name = "Danil Kaliakin", side = "PARTNER", arxiv_name = "Danil Kaliakin" },
    { name = "Fangchun Liang", side = "PARTNER", arxiv_name = "Fangchun Liang" },
    { name = "Subhamoy Bhowmik", side = "PARTNER", arxiv_name = "Subhamoy Bhowmik" },
    { name = "Susanta Das", side = "PARTNER", arxiv_name = "Susanta Das" },
    { name = "Sergii Strelchuk", side = "PARTNER", arxiv_name = "Sergii Strelchuk" },
]

[matching]
auto_link = 95
review = 85
year_window = [-1, 3]

[master]
# The current approved workbook template is still required for every partner.
path = ""
