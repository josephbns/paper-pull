        \ <entry>\n    <id>http://arxiv.org/abs/2410.09209v2</id>\n    <title>Accurate
        quantum-centric simulations of supramolecular interactions</title>\n    <updated>2024-11-22T14:57:34Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2410.09209v2\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2410.09209v2\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>We present the first quantum-centric simulations
        of noncovalent interactions using a supramolecular approach. We simulate the
        potential energy surfaces (PES) of the water and methane dimers, featuring
        hydrophilic and hydrophobic interactions, respectively, with a sample-based
        quantum diagonalization (SQD) approach. Our simulations on quantum processors,
        using 27- and 36-qubit circuits, are in remarkable agreement with classical
        methods, deviating from complete active space configuration interaction (CASCI)
        and coupled-cluster singles, doubles, and perturbative triples (CCSD(T)) within
        1 kcal/mol in the equilibrium regions of the PES. Finally, we test the capacity
        limits of the quantum methods for capturing hydrophobic interactions with
        an experiment on 54 qubits. These results mark significant progress in the
        application of quantum computing to chemical problems, paving the way for
        more accurate modeling of noncovalent interactions in complex systems critical
        to the biological, chemical and pharmaceutical sciences.</summary>\n    <category
        term=\"quant-ph\" scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2024-10-11T19:25:47Z</published>\n
