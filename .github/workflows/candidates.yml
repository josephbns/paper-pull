name: Generate candidate Excel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check dependencies, lint, and formatting
        run: |
          python -m pip check
          ruff check .
          ruff format --check .

      - name: Run all offline tests
        run: python -m pytest -o addopts='' -q --block-network

      - name: Run synthetic dry run
        run: pubmon run --dry-run --master tests/fixtures/synthetic_master.xlsx --fixtures tests/fixtures/api

      - name: Verify secret availability
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PUBMON_EMAIL: ${{ secrets.PUBMON_EMAIL }}
        run: |
          python - <<'PY'
          import os
          import sys
          missing = [name for name in ("OPENALEX_API_KEY", "PUBMON_EMAIL") if not os.environ.get(name)]
          if missing:
              print("Missing repository secrets: " + ", ".join(missing))
              sys.exit(1)
          print("Both required repository secrets are available.")
          PY

      - name: Run live source tests with fresh recordings
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PUBMON_EMAIL: ${{ secrets.PUBMON_EMAIL }}
        run: |
          rm -rf tests/cassettes/test_source_recordings
          python -m pytest -o addopts='' tests/test_source_recordings.py -q --record-mode=once --tb=no

      - name: Collect live public metadata and generate Excel
        id: collection
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PUBMON_EMAIL: ${{ secrets.PUBMON_EMAIL }}
        run: pubmon run --backfill --no-master --xlsx

      - name: Upload candidate Excel and CSV
        if: ${{ !cancelled() && steps.collection.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: publication-candidates-${{ github.run_number }}
          path: |
            out/master_*.xlsx
            out/candidates_*.xlsx
            out/candidates_*.csv
            out/works_*.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Explain results
        if: ${{ !cancelled() }}
        env:
          COLLECTION_OUTCOME: ${{ steps.collection.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          outcome = os.environ["COLLECTION_OUTCOME"]
          text = (
              "## Publication collection\n\n"
              f"Collection step: **{outcome}**.\n\n"
              "Download the publication-candidates artifact below and open master_<date>.xlsx for the full generated tracker. "
              "The candidate Excel contains only new/changed papers. "
              "A failed collection can leave partial files; do not treat those as a complete result.\n\n"
              "This manual run starts with fresh history and searches from the configured start date. "
              "Repeated runs can include the same papers; weekly incremental state is not implemented here. "
              "No real master workbook is used or changed. Manual fields remain blank and uncertain papers are flagged for review.\n"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
              stream.write(text)
          PY
