# Cleveland Clinic profile for pubmon.
#
# Public criteria only: institution IDs, names of authors on public papers, and keywords.
# Never put API keys, email addresses or the path to the real master workbook here: those
# go in your private .env file (see docs/SETUP.md). Check this file with:
#     pubmon check-profile --profile cleveland-clinic

[qic]
name = "Cleveland Clinic"            # partner name used in labels and lookups
label = "CCF"                        # short label
collaboration = "IBM–Cleveland Clinic"
start_date = "2021-01-01"            # ignore papers published before this date
# Names of the IBM system installed at the partner. A paper with no partner author that
# names it goes to the "Hardware only" sheet instead of Publications.
onsite_hardware = [
  "ibm_cleveland", "System One at the Cleveland Clinic", "System One at Cleveland Clinic",
]
# Where history and outputs are stored. "." keeps the existing Cleveland Clinic history.
# Every other QIC must use its own folder, such as "workspaces/<qic-name>".
workspace = "."

[institutions]
# OpenAlex institution IDs. Find candidates with: pubmon resolve-institutions --profile <name>
# A parent ID also covers its child labs through OpenAlex "lineage".
ibm = ["I1341412227"]
partner = ["I1316902750"]
# TODO(owner): review IBM Japan / other IBM entities and Clinic Abu Dhabi, Akron, London.

[topic]
# Phrases that make a paper "quantum". They are used three ways: to search OpenAlex for
# partner papers, to search arXiv, and to fill the "Quantum?" column.
# Use specific phrases; the bare word "quantum" also matches "quantum dots" and
# "quantum mechanical calculations".
terms = [
  "quantum computing", "quantum computer", "quantum computers", "quantum hardware",
  "quantum processor", "quantum processors", "quantum circuit", "quantum circuits",
  "quantum algorithm", "quantum algorithms", "quantum machine learning",
  "quantum-centric", "Qiskit", "qubit", "qubits",
]
# A broad word marks "Maybe" when no specific phrase matched (for a person to decide).
# It is never used to search, because it also matches "quantum dots" and similar.
broad_terms = ["quantum"]
arxiv_categories = ["quant-ph"]      # any paper in these arXiv categories counts as on-topic
# Phrases suggesting IBM quantum hardware was used. They only flag papers that have no IBM
# author, in the "IBM hardware (suggested)" column, for a person to confirm.
# TODO(owner): review this first draft.
hardware_terms = [
  "ibm_cleveland", "IBM Quantum System One", "IBM quantum computer", "IBM quantum computers",
  "IBM quantum processor", "IBM quantum hardware", "IBM Heron", "IBM Eagle", "Qiskit Runtime",
]

[search]
arxiv_window_days = 90               # weekly runs look back this many days on arXiv
# Extra arXiv search phrases (any field) that find partner papers besides the people below.
arxiv_phrases = ["Cleveland Clinic", "ibm_cleveland"]
# Names shared by many researchers. A paper matched only by these is marked uncertain.
# TODO(owner): review collision-prone names, for example Jun Qin.
common_names = ["Jie Shi"]

[matching]
auto_link = 95                       # title similarity (0-100) to merge versions automatically
review = 85                          # title similarity that asks a person to check
year_window = [-1, 3]                # years a journal version may differ from its preprint

# ---------------------------------------------------------------------------------------
# People. Each person is listed once.
#   side    "partner" people FIND papers (their names build the arXiv search).
#           "ibm" people only CONFIRM papers: searching for them would pull in every quantum
#           paper they write, with or without the partner.
#   aliases other spellings used on papers (middle initials, hyphens, accents).
#   tab     "backup" sends papers found only through this person to a separate Backup tab.
#   orcid   optional unique researcher ID (https://orcid.org), more reliable than a name.
# Only add names that already appear on public collaboration papers (docs/SECURITY.md).
# ---------------------------------------------------------------------------------------

